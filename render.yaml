# Render Blueprint specification for MediaLens AI Backend
# Documentation: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: medialens-ai-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free # Free tier (512 MB RAM). For higher video workload performance, upgrade to starter (2 GB RAM).
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: OPENCV_FORCE_DNN_ENGINE
        value: "2"
      - key: MEDIALENS_MAX_CONCURRENT_INFERENCE
        value: "2"
      - key: MEDIALENS_ALLOWED_ORIGINS
        value: "https://medialens-ai.vercel.app,http://localhost:5173,http://localhost:5175"
      - key: MEDIALENS_CHECKPOINT_URL
        value: "https://github.com/luckydwivedi12/medialens-ai/releases/download/v0.12.0/best_model.pth"
      - key: MEDIALENS_AUTH_TOKEN
        sync: false # Optional bearer token for protected artifact storage
      - key: MEDIALENS_AUTO_DOWNLOAD_YUNET
        value: "1" # Automatically fetches verified YuNet ONNX model from OpenCV Zoo

